# Pings IndexNow (Bing & friends) whenever site pages change on main, so
# search engines learn about updates in minutes instead of on their crawl
# schedule. Manual runs (workflow_dispatch) submit every URL in sitemap.xml.
name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for Pages deploy
        run: sleep 90

      - name: Submit URLs to IndexNow
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'EOF'
          import json, os, re, subprocess, urllib.request

          HOST = "amlin.ai"
          KEY = "58ed86654c46e06cde964733cf3cac71"
          # Pages that are noindex or app-only never get submitted
          SKIP = {"404.html", "download.html", "help.html"}

          def to_url(path):
              return f"https://{HOST}/" if path == "index.html" else f"https://{HOST}/{path}"

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              xml = open("sitemap.xml").read()
              urls = re.findall(r"<loc>(.*?)</loc>", xml)
          else:
              diff = subprocess.run(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                  capture_output=True, text=True, check=True).stdout.split()
              pages = [f for f in diff if f.endswith(".html")
                       and "/" not in f and f not in SKIP]
              urls = [to_url(p) for p in pages]

          if not urls:
              print("No page changes to submit.")
              raise SystemExit(0)

          body = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req) as resp:
              print(f"IndexNow responded {resp.status} for {len(urls)} URL(s):")
              for u in urls:
                  print(" ", u)
          EOF
